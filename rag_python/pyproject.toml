[project]
name = "rag-python"
version = "0.1.0"
description = "RAG evaluation pipeline using Google Gemini (RAGAS + LangSmith)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-text-splitters",
    "langchain-google-genai",
    "langchain-chroma",
    "langsmith",
    "chromadb",
    "pypdf",
    "ragas",
    "rapidfuzz",
    "beautifulsoup4",
    "python-dotenv",
    "pandas",
    "openpyxl",
    "datasets",
    "tqdm",
    "typing-extensions",
]

[project.scripts]
rag-generate-dataset = "rag_eval.generate_dataset:main"
rag-evaluate = "rag_eval.evaluate:main"
rag-langsmith = "rag_eval.langsmith_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_eval"]
